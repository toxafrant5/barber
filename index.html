<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anton Frantsuzov | Онлайн-запись</title>
  <style>
    :root { --bg: #0f0f0f; --card: #1a1a1a; --border: #2e2e2e; --red: #dc2626; --red-hover: #b91c1c; --tg: #229ED9; --tg-hover: #1d8abf; --text: #f5f5f5; --muted: #a3a3a3; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; padding-bottom: 50px; line-height: 1.4; }
    header { border-bottom: 1px solid var(--border); padding: 14px 16px; background: rgba(0,0,0,0.85); position: sticky; top: 0; backdrop-filter: blur(8px); z-index: 10; margin-bottom: 24px; }
    .header-inner { max-width: 600px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .logo-wrap { display: flex; align-items: center; gap: 12px; }
    .logo-circle { width: 40px; height: 40px; border-radius: 50%; background: var(--red); display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
    .container { max-width: 600px; margin: 0 auto; padding: 0 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    h2 { font-size: 18px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .step-badge { width: 24px; height: 24px; border-radius: 50%; background: var(--red); font-size: 12px; display: inline-flex; align-items: center; justify-content: center; }
    .service-item { padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: #141414; cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; transition: 0.15s; }
    .service-item:hover { border-color: #555; }
    .service-item.selected { border-color: var(--red); background: rgba(220, 38, 38, 0.15); }
    input, select { width: 100%; background: #121212; border: 1px solid #3a3a3a; border-radius: 10px; padding: 12px; color: #fff; font-size: 15px; margin-top: 4px; margin-bottom: 12px; }
    input:focus, select:focus { outline: none; border-color: var(--red); }
    label { font-size: 12px; color: var(--muted); display: block; }
    .btn { background: var(--red); color: #fff; border: none; border-radius: 10px; padding: 13px 18px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; transition: 0.15s; text-decoration: none; display: inline-block; text-align: center; }
    .btn:hover { background: var(--red-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-tg { background: var(--tg); color: #fff; border: none; border-radius: 10px; padding: 12px 16px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: 0.15s; }
    .btn-tg:hover { background: var(--tg-hover); }
    .btn-outline { background: #262626; color: #e5e5e5; border: 1px solid #3a3a3a; padding: 8px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn-outline:hover { border-color: #666; }
    .secret-btn { background: transparent; border: none; color: #555; font-size: 16px; cursor: pointer; padding: 6px; transition: 0.2s; line-height: 1; user-select: none; }
    .secret-btn:hover { color: #999; }
    .slots-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
    .slot-btn { padding: 10px; border-radius: 8px; border: 1px solid #3a3a3a; background: #141414; color: #fff; cursor: pointer; font-weight: 500; }
    .slot-btn.selected { background: var(--red); border-color: var(--red); }
    .hidden { display: none !important; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
    .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px; width: 100%; max-width: 400px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .day-chip { padding: 8px 12px; border-radius: 8px; border: 1px solid #3a3a3a; background: #141414; color: #aaa; cursor: pointer; font-size: 13px; user-select: none; }
    .day-chip.active { background: var(--red); color: #fff; border-color: var(--red); }
    .tag { display: inline-flex; align-items: center; gap: 6px; background: #262626; padding: 4px 10px; border-radius: 6px; font-size: 12px; margin: 3px; }
    .app-card { background: #141414; border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo-wrap">
        <div class="logo-circle">AF</div>
        <div>
          <div style="font-weight:700; letter-spacing:0.5px;">ANTON FRANTSUZOV</div>
          <div style="font-size:12px; color:var(--muted);">Barber & Male Bio-Curling</div>
        </div>
      </div>
      <div class="row">
        <a id="header-tg-link" href="#" target="_blank" class="btn-outline" style="border-color: var(--tg); color: #38bdf8;">✈️ Telegram</a>
        <button onclick="toggleAdminModal()" class="secret-btn" aria-label="Настройки">✂️</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- КЛИЕНТСКИЙ ЭКРАН -->
    <div id="client-view">
      <div class="card">
        <h2><span class="step-badge">1</span> Выберите услугу</h2>
        <div id="services-list"></div>
      </div>

      <div class="card">
        <h2><span class="step-badge">2</span> Выберите дату и время</h2>
        <p style="font-size:12px; color:var(--muted); margin-bottom:10px;">Часы работы: 10:00 – 21:00</p>
        <input type="date" id="booking-date" onchange="renderTimeSlots()">
        <div id="time-slots-container">
          <p style="font-size:13px; color:var(--muted);">Сначала выберите услугу и дату</p>
        </div>
      </div>

      <div class="card">
        <h2><span class="step-badge">3</span> Ваши контакты</h2>
        <label>Ваше имя</label>
        <input type="text" id="client-name" placeholder="Например, Александр">
        
        <label>Номер телефона</label>
        <input type="tel" id="client-phone" value="+7 " oninput="formatPhoneInput(this)" onfocus="if(!this.value.startsWith('+7')) this.value='+7 '" placeholder="+7 (999) 000-00-00">
        
        <button onclick="submitBooking()" id="submit-btn" class="btn">Записаться</button>
        <div id="booking-msg" class="hidden" style="margin-top:14px; text-align:center; font-size:14px;"></div>
      </div>
    </div>

    <!-- КАБИНЕТ МАСТЕРА -->
    <div id="admin-view" class="hidden">
      <div class="row" style="justify-content:space-between; margin-bottom:16px;">
        <h2 style="margin:0; font-size:22px;">Панель мастера</h2>
        <button onclick="exitAdmin()" class="btn-outline" style="color:#f87171;">Выйти</button>
      </div>

      <!-- УПРАВЛЕНИЕ ГРАФИКОМ -->
      <div class="card">
        <h2>Управление рабочими днями</h2>
        <label style="margin-bottom:6px;">Постоянные рабочие дни недели:</label>
        <div class="row" id="workdays-chips" style="margin-bottom:14px;"></div>

        <div style="border-top:1px solid var(--border); padding-top:12px; margin-top:8px;">
          <label>Сделать конкретную дату рабочей или выходным:</label>
          <div class="row" style="margin-top:6px;">
            <input type="date" id="override-date" style="flex:1; margin:0;">
            <button onclick="addDateOverride('open')" class="btn-outline" style="background:#166534; border-color:#15803d;">+ Рабочий</button>
            <button onclick="addDateOverride('closed')" class="btn-outline" style="background:#7f1d1d; border-color:#991b1b;">+ Выходной</button>
          </div>
          <div id="overrides-list" style="margin-top:10px;"></div>
        </div>
        <button onclick="saveSchedule()" id="save-sched-btn" class="btn" style="margin-top:12px; padding:10px;">Сохранить график</button>
      </div>

      <!-- ФИЛЬТР И ДОБАВЛЕНИЕ ЗАПИСИ ВРУЧНУЮ -->
      <div class="card">
        <div class="row" style="justify-content:space-between;">
          <div style="flex:1; min-width:180px;">
            <label>Фильтр по дате</label>
            <input type="date" id="admin-filter-date" onchange="renderAdminList()" style="margin-bottom:0;">
          </div>
          <div class="row" style="margin-top:14px;">
            <button onclick="document.getElementById('admin-filter-date').value=''; renderAdminList();" class="btn-outline">Все даты</button>
            <button onclick="openEditModal(null)" class="btn-outline" style="background:var(--red); border-color:var(--red);">+ Добавить запись</button>
            <button onclick="loadAppointments(true)" class="btn-outline">Обновить</button>
          </div>
        </div>
      </div>

      <div id="admin-appointments-list"></div>
    </div>
  </main>

  <!-- МОДАЛКА ПАРОЛЯ -->
  <div id="password-modal" class="modal hidden">
    <div class="modal-box">
      <h2 style="margin-bottom:12px;">Вход для мастера</h2>
      <input type="password" id="admin-pass-input" placeholder="Введите пароль">
      <div class="row">
        <button onclick="checkAdminPass()" class="btn" style="flex:1;">Войти</button>
        <button onclick="toggleAdminModal()" class="btn-outline" style="flex:1; padding:13px;">Отмена</button>
      </div>
    </div>
  </div>

  <!-- МОДАЛКА РЕДАКТИРОВАНИЯ / СОЗДАНИЯ -->
  <div id="edit-modal" class="modal hidden">
    <div class="modal-box">
      <h2 id="edit-modal-title">Редактировать запись</h2>
      <input type="hidden" id="edit-id">
      
      <label>Имя клиента</label>
      <input type="text" id="edit-name">
      
      <label>Телефон</label>
      <input type="tel" id="edit-phone" oninput="formatPhoneInput(this)">
      
      <label>Услуга</label>
      <select id="edit-service" onchange="autoCalcEndTime()"></select>
      
      <label>Дата</label>
      <input type="date" id="edit-date">
      
      <div class="row">
        <div style="flex:1;">
          <label>Начало (ЧЧ:ММ)</label>
          <input type="time" id="edit-time" onchange="autoCalcEndTime()">
        </div>
        <div style="flex:1;">
          <label>Конец (ЧЧ:ММ)</label>
          <input type="time" id="edit-end-time">
        </div>
      </div>

      <div class="row" style="margin-top:8px;">
        <button onclick="saveEdit()" id="save-edit-btn" class="btn" style="flex:1;">Сохранить</button>
        <button onclick="closeEditModal()" class="btn-outline" style="flex:1; padding:13px;">Отмена</button>
      </div>
    </div>
  </div>

  <script>
    // --- НАСТРОЙКИ ССЫЛОК И TELEGRAM ---
    const API_URL = 'https://script.google.com/macros/s/AKfycbygzBCtiQOGgt6uKHVzjYMvXELFuHVWgvofBAlYk_ZrroyEKnCc5-MkxscbI1M6ZXyY/exec';
    const BOT_USERNAME = 'anton_barber_bot';       // <--- ТВОЙ ЮЗЕРНЕЙМ БОТА (без @)
    const MASTER_TG_USERNAME = 'anton_frantsuzov'; // <--- ТВОЙ ЛИЧНЫЙ АККАУНТ В ТГ ДЛЯ СВЯЗИ (без @)

    const services = [
      { id: 1, name: 'Стрижка', price: 1700, duration: 60 },
      { id: 2, name: 'Борода', price: 1300, duration: 30 },
      { id: 3, name: 'Комплекс стрижка + борода', price: 2500, duration: 90 },
      { id: 4, name: 'Биозавивка топ зоны', price: 5000, duration: 120 },
      { id: 5, name: 'Биозавивка всей головы', price: 6500, duration: 180 }
    ];

    const DAY_NAMES = [
      { id: 1, label: 'Пн' }, { id: 2, label: 'Вт' }, { id: 3, label: 'Ср' },
      { id: 4, label: 'Чт' }, { id: 5, label: 'Пт' }, { id: 6, label: 'Сб' }, { id: 0, label: 'Вс' }
    ];

    let selectedService = null;
    let selectedTime = null;
    let allAppointments = [];
    let scheduleConfig = { workDays: [1, 2, 5, 6], extraWorkDates: [], closedDates: [] };

    const START_HOUR = 10;
    const END_HOUR = 21;

    function formatPhoneInput(input) {
      let digits = input.value.replace(/\D/g, '');
      if (digits.startsWith('7') || digits.startsWith('8')) {
        digits = digits.substring(1);
      }
      digits = digits.substring(0, 10);
      let formatted = '+7';
      if (digits.length > 0) formatted += ' (' + digits.substring(0, 3);
      if (digits.length >= 4) formatted += ') ' + digits.substring(3, 6);
      if (digits.length >= 7) formatted += '-' + digits.substring(6, 8);
      if (digits.length >= 9) formatted += '-' + digits.substring(8, 10);
      input.value = formatted;
    }

    function getCleanPhone(val) {
      let digits = String(val).replace(/\D/g, '');
      if (digits.startsWith('8')) digits = '7' + digits.substring(1);
      if (!digits.startsWith('7')) digits = '7' + digits;
      return '+' + digits;
    }

    function normalizeDate(val) {
      if (!val) return '';
      const s = String(val).trim();
      if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
      const d = new Date(s);
      if (!isNaN(d.getTime())) {
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      }
      return s;
    }

    function normalizeTime(val) {
      if (!val) return '';
      const s = String(val).trim();
      const match = s.match(/(\d{1,2}):(\d{2})/);
      if (match && !s.includes('T')) return match[1].padStart(2, '0') + ':' + match[2];
      const d = new Date(s);
      if (!isNaN(d.getTime())) return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      return s;
    }

    function timeToMinutes(t) {
      const clean = normalizeTime(t);
      if (!clean) return 0;
      const parts = clean.split(':').map(Number);
      return (parts[0] || 0) * 60 + (parts[1] || 0);
    }

    function minutesToTime(m) {
      const h = Math.floor(m / 60).toString().padStart(2, '0');
      const min = (m % 60).toString().padStart(2, '0');
      return `${h}:${min}`;
    }

    function isWorkingDate(dateStr) {
      if (scheduleConfig.closedDates && scheduleConfig.closedDates.includes(dateStr)) return false;
      if (scheduleConfig.extraWorkDates && scheduleConfig.extraWorkDates.includes(dateStr)) return true;
      const [y, m, d] = dateStr.split('-').map(Number);
      const dayOfWeek = new Date(y, m - 1, d).getDay();
      return scheduleConfig.workDays.includes(dayOfWeek);
    }

    async function init() {
      document.getElementById('header-tg-link').href = `https://t.me/${MASTER_TG_USERNAME}`;

      const today = new Date().toISOString().split('T')[0];
      document.getElementById('booking-date').min = today;
      document.getElementById('booking-date').value = today;

      const sel = document.getElementById('edit-service');
      services.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.name;
        opt.innerText = `${s.name} (${s.duration} мин)`;
        sel.appendChild(opt);
      });

      renderServices();
      await fetchAllData();
    }

    async function fetchAllData() {
      try {
        const res = await fetch(API_URL + '?t=' + Date.now());
        const data = await res.json();
        const rawApps = Array.isArray(data) ? data : (data.appointments || []);
        if (data.schedule) scheduleConfig = data.schedule;

        allAppointments = rawApps.map(item => {
          const startT = normalizeTime(item.appointment_time);
          let endT = normalizeTime(item.end_time);
          if (!endT && startT) {
            const srv = services.find(s => s.name === item.service_name);
            const dur = srv ? srv.duration : 60;
            endT = minutesToTime(timeToMinutes(startT) + dur);
          }
          return {
            ...item,
            appointment_date: normalizeDate(item.appointment_date),
            appointment_time: startT,
            end_time: endT
          };
        });
      } catch (e) {
        console.error('Ошибка загрузки:', e);
      }
    }

    function renderServices() {
      const container = document.getElementById('services-list');
      container.innerHTML = '';
      services.forEach(s => {
        const isSelected = selectedService && selectedService.id === s.id;
        const div = document.createElement('div');
        div.className = `service-item ${isSelected ? 'selected' : ''}`;
        div.onclick = () => {
          selectedService = s;
          selectedTime = null;
          renderServices();
          renderTimeSlots();
        };
        div.innerHTML = `
          <div>
            <div style="font-weight:600;">${s.name}</div>
            <div style="font-size:12px; color:var(--muted);">${s.duration} мин</div>
          </div>
          <div style="font-weight:700; font-size:17px;">${s.price} ₽</div>
        `;
        container.appendChild(div);
      });
    }

    async function renderTimeSlots(skipFetch = false) {
      const container = document.getElementById('time-slots-container');
      const dateVal = document.getElementById('booking-date').value;
      selectedTime = null;

      if (!selectedService || !dateVal) {
        container.innerHTML = '<p style="font-size:13px; color:var(--muted);">Пожалуйста, выберите услугу и дату</p>';
        return;
      }

      if (!skipFetch) {
        container.innerHTML = '<p style="font-size:13px; color:var(--muted);">Проверка свободных окон...</p>';
        await fetchAllData();
      }

      if (!isWorkingDate(dateVal)) {
        container.innerHTML = '<div style="padding:12px; border-radius:10px; background:#141414; border:1px solid #333; color:#fbbf24; font-size:13px;">В этот день мастер не работает. Выберите другую дату.</div>';
        return;
      }

      const booked = allAppointments.filter(a => a.appointment_date === dateVal);
      const busyIntervals = booked.map(b => {
        const start = timeToMinutes(b.appointment_time);
        const end = b.end_time ? timeToMinutes(b.end_time) : (start + 60);
        return { start, end };
      });

      const slots = [];
      const startMin = START_HOUR * 60;
      const endMin = END_HOUR * 60;

      for (let t = startMin; t + selectedService.duration <= endMin; t += 30) {
        const slotEnd = t + selectedService.duration;
        const isConflict = busyIntervals.some(b => t < b.end && slotEnd > b.start);
        if (!isConflict) slots.push(minutesToTime(t));
      }

      if (slots.length === 0) {
        container.innerHTML = '<p style="font-size:13px; color:#f87171;">На эту дату нет свободных окон для выбранной услуги.</p>';
        return;
      }

      container.innerHTML = '<div class="slots-grid" id="slots-grid"></div>';
      const grid = document.getElementById('slots-grid');
      slots.forEach(time => {
        const btn = document.createElement('button');
        btn.className = 'slot-btn';
        btn.innerText = time;
        btn.onclick = () => {
          selectedTime = time;
          document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
        };
        grid.appendChild(btn);
      });
    }

    async function submitBooking() {
      const name = document.getElementById('client-name').value.trim();
      const rawPhone = document.getElementById('client-phone').value;
      const cleanPhone = getCleanPhone(rawPhone);
      const dateVal = document.getElementById('booking-date').value;
      const msg = document.getElementById('booking-msg');

      if (!selectedService || !dateVal || !selectedTime || !name || cleanPhone.length < 12) {
        msg.className = '';
        msg.style.color = '#f87171';
        msg.innerText = 'Заполните имя, полный номер телефона (+7...) и выберите время.';
        return;
      }

      const bookedTime = selectedTime;
      const bookedService = selectedService;
      const endTime = minutesToTime(timeToMinutes(bookedTime) + bookedService.duration);

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = 'Сохранение...';

      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'create',
            client_name: name,
            client_phone: cleanPhone,
            service_name: bookedService.name,
            appointment_date: dateVal,
            appointment_time: bookedTime,
            end_time: endTime
          })
        });

        allAppointments.push({
          id: Date.now().toString(),
          client_name: name,
          client_phone: cleanPhone,
          service_name: bookedService.name,
          appointment_date: dateVal,
          appointment_time: bookedTime,
          end_time: endTime
        });

        const cleanDigits = cleanPhone.replace('+', '');
        const tgBotLink = `https://t.me/${BOT_USERNAME}?start=${cleanDigits}`;
        const masterLink = `https://t.me/${MASTER_TG_USERNAME}`;

        msg.className = '';
        msg.style.backgroundColor = '#141414';
        msg.style.border = '1px solid #2e2e2e';
        msg.style.padding = '16px';
        msg.style.borderRadius = '12px';
        msg.innerHTML = `
          <div style="color: #4ade80; font-weight: 600; font-size: 16px; margin-bottom: 6px;">✅ Вы успешно записаны, ${name}!</div>
          <div style="font-size: 13px; color: var(--text); margin-bottom: 14px;">
            Услуга: <b>${bookedService.name}</b><br>
            Дата и время: <b>${dateVal} с ${bookedTime} до ${endTime}</b>
          </div>
          <a href="${tgBotLink}" target="_blank" class="btn-tg" style="width: 100%; margin-bottom: 10px;">
            🔔 Получить подтверждение и напоминание в Telegram
          </a>
          <div style="font-size: 12px; color: var(--muted); margin-top: 6px;">
            Вопросы по записи? <a href="${masterLink}" target="_blank" style="color: #38bdf8; text-decoration: none;">Написать мастеру (@${MASTER_TG_USERNAME})</a>
          </div>
        `;

        document.getElementById('client-name').value = '';
        document.getElementById('client-phone').value = '+7 ';
        await renderTimeSlots(true);
      } catch (err) {
        msg.className = '';
        msg.style.color = '#f87171';
        msg.innerText = 'Ошибка при сохранении. Попробуйте еще раз.';
      }

      btn.disabled = false;
      if (btn.innerText === 'Сохранение...') btn.innerText = 'Записаться';
    }

    // --- КАБИНЕТ МАСТЕРА ---
    function toggleAdminModal() {
      document.getElementById('password-modal').classList.toggle('hidden');
      document.getElementById('admin-pass-input').value = '';
    }

    function checkAdminPass() {
      if (document.getElementById('admin-pass-input').value === 'Smart31415') {
        toggleAdminModal();
        document.getElementById('client-view').classList.add('hidden');
        document.getElementById('admin-view').classList.remove('hidden');
        loadAppointments(true);
      } else {
        alert('Неверный пароль!');
      }
    }

    function exitAdmin() {
      document.getElementById('admin-view').classList.add('hidden');
      document.getElementById('client-view').classList.remove('hidden');
      renderTimeSlots(true);
    }

    function renderScheduleAdmin() {
      const chipsWrap = document.getElementById('workdays-chips');
      chipsWrap.innerHTML = '';
      DAY_NAMES.forEach(d => {
        const active = scheduleConfig.workDays.includes(d.id);
        const span = document.createElement('span');
        span.className = `day-chip ${active ? 'active' : ''}`;
        span.innerText = d.label;
        span.onclick = () => {
          if (scheduleConfig.workDays.includes(d.id)) {
            scheduleConfig.workDays = scheduleConfig.workDays.filter(x => x !== d.id);
          } else {
            scheduleConfig.workDays.push(d.id);
          }
          renderScheduleAdmin();
        };
        chipsWrap.appendChild(span);
      });

      const ovList = document.getElementById('overrides-list');
      ovList.innerHTML = '';
      (scheduleConfig.extraWorkDates || []).forEach(dt => {
        ovList.innerHTML += `<span class="tag" style="border:1px solid #15803d; color:#4ade80;">Рабочий: ${dt} <b style="cursor:pointer;" onclick="removeOverride('${dt}')">×</b></span>`;
      });
      (scheduleConfig.closedDates || []).forEach(dt => {
        ovList.innerHTML += `<span class="tag" style="border:1px solid #991b1b; color:#f87171;">Выходной: ${dt} <b style="cursor:pointer;" onclick="removeOverride('${dt}')">×</b></span>`;
      });
    }

    function addDateOverride(type) {
      const dt = document.getElementById('override-date').value;
      if (!dt) return;
      scheduleConfig.extraWorkDates = (scheduleConfig.extraWorkDates || []).filter(x => x !== dt);
      scheduleConfig.closedDates = (scheduleConfig.closedDates || []).filter(x => x !== dt);
      if (type === 'open') scheduleConfig.extraWorkDates.push(dt);
      if (type === 'closed') scheduleConfig.closedDates.push(dt);
      renderScheduleAdmin();
    }

    function removeOverride(dt) {
      scheduleConfig.extraWorkDates = (scheduleConfig.extraWorkDates || []).filter(x => x !== dt);
      scheduleConfig.closedDates = (scheduleConfig.closedDates || []).filter(x => x !== dt);
      renderScheduleAdmin();
    }

    async function saveSchedule() {
      const btn = document.getElementById('save-sched-btn');
      btn.innerText = 'Сохранение графика...';
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'save_schedule', schedule: scheduleConfig })
      });
      btn.innerText = 'Сохранено!';
      setTimeout(() => btn.innerText = 'Сохранить график', 1500);
    }

    async function loadAppointments(forceFetch = false) {
      const list = document.getElementById('admin-appointments-list');
      list.innerHTML = '<p style="font-size:13px; color:var(--muted);">Загрузка...</p>';
      if (forceFetch) await fetchAllData();
      renderScheduleAdmin();
      renderAdminList();
    }

    function renderAdminList() {
      const list = document.getElementById('admin-appointments-list');
      const filterDate = document.getElementById('admin-filter-date').value;

      let data = [...allAppointments].filter(a => a.id);
      if (filterDate) data = data.filter(a => a.appointment_date === filterDate);

      data.sort((a, b) => (a.appointment_date + ' ' + a.appointment_time).localeCompare(b.appointment_date + ' ' + b.appointment_time));

      if (data.length === 0) {
        list.innerHTML = '<div class="card" style="text-align:center; color:var(--muted);">Записей нет</div>';
        return;
      }

      list.innerHTML = '';
      data.forEach(app => {
        const cleanDigits = String(app.client_phone).replace(/\D/g, '');
        const clientTgLink = `https://t.me/${BOT_USERNAME}?start=${cleanDigits}`;
        const inviteText = encodeURIComponent(`Привет, ${app.client_name}! Записал тебя на ${app.appointment_date} в ${app.appointment_time} (${app.service_name}). Подтверждение и напоминания в боте: ${clientTgLink} | Связь со мной: https://t.me/${MASTER_TG_USERNAME}`);

        const card = document.createElement('div');
        card.className = 'app-card';
        card.innerHTML = `
          <div>
            <div style="font-size:12px; color:#f87171; font-weight:600;">${app.appointment_date} | ${app.appointment_time} – ${app.end_time || ''}</div>
            <div style="font-weight:700; font-size:16px; margin:2px 0;">${app.client_name} <span style="font-weight:400; font-size:13px; color:var(--muted);">(${app.client_phone})</span></div>
            <div style="font-size:13px; color:#d4d4d4;">${app.service_name}</div>
          </div>
          <div class="row">
            <a href="sms:${app.client_phone}?body=${inviteText}" class="btn-outline" style="background:#0284c7; border-color:#0369a1;" title="Отправить СМС с приглашением в бота">СМС с ботом</a>
            <button onclick='openEditModal(${JSON.stringify(app)})' class="btn-outline">Изменить</button>
            <button onclick="deleteAppointment('${app.id}')" class="btn-outline" style="background:#7f1d1d;">Удалить</button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    async function deleteAppointment(id) {
      if (!confirm('Удалить эту запись?')) return;
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'delete', id })
      });
      await loadAppointments(true);
    }

    function autoCalcEndTime() {
      const srvName = document.getElementById('edit-service').value;
      const startVal = document.getElementById('edit-time').value;
      if (!startVal) return;
      const srv = services.find(s => s.name === srvName);
      const dur = srv ? srv.duration : 60;
      document.getElementById('edit-end-time').value = minutesToTime(timeToMinutes(startVal) + dur);
    }

    function openEditModal(app) {
      const isNew = !app;
      document.getElementById('edit-modal-title').innerText = isNew ? 'Новая запись' : 'Редактировать запись';
      document.getElementById('edit-id').value = isNew ? '' : app.id;
      document.getElementById('edit-name').value = isNew ? '' : app.client_name;
      document.getElementById('edit-phone').value = isNew ? '+7 ' : app.client_phone;
      document.getElementById('edit-service').value = isNew ? services[0].name : app.service_name;
      document.getElementById('edit-date').value = isNew ? new Date().toISOString().split('T')[0] : app.appointment_date;
      document.getElementById('edit-time').value = isNew ? '12:00' : app.appointment_time;
      document.getElementById('edit-end-time').value = isNew ? '13:00' : (app.end_time || '13:00');
      document.getElementById('edit-modal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.add('hidden');
    }

    async function saveEdit() {
      const btn = document.getElementById('save-edit-btn');
      btn.innerText = 'Сохранение...';
      const id = document.getElementById('edit-id').value;
      const client_name = document.getElementById('edit-name').value.trim();
      const client_phone = getCleanPhone(document.getElementById('edit-phone').value);
      const service_name = document.getElementById('edit-service').value;
      const appointment_date = document.getElementById('edit-date').value;
      const appointment_time = document.getElementById('edit-time').value;
      const end_time = document.getElementById('edit-end-time').value;

      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: id ? 'update' : 'create',
          from_admin: true,
          id, client_name, client_phone, service_name, appointment_date, appointment_time, end_time
        })
      });

      btn.innerText = 'Сохранить';
      closeEditModal();
      await loadAppointments(true);
    }

    init();
  </script>
</body>
</html>
